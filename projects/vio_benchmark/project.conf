# vio_benchmark — walker launcher settings. Data, not shell: KEY=value, read
# never sourced (CPP_DESIGN.md §4).
#
# The forward fisheye pair must be rendering: OpenVINS runs on it, and the
# camera set is fixed while the simulation is up -- so this has to be chosen
# before the sim starts.
CAMERAS=fisheye
# Steers on flight_control_setpoint_ENUvelocity_yawrate.
SETPOINT=velocity
# The whole sortie (climb, approach, the 840 m transit or the helix, return)
# takes up to ~15 min of WALL time at the ~0.5 real-time factor the cameras
# cause; walker stops a mission that overruns this.
TIMEOUT=3600
